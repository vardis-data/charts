{{- if .Values.clickhouse.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lakehouse.fullname" . }}-backup-prune
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.clickhouse.backup.pruneSchedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "lakehouse.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup-prune
        spec:
          restartPolicy: OnFailure
          containers:
            - name: prune
              image: minio/mc:latest
              command: ["/bin/sh", "/scripts/prune.sh"]
              env:
                - name: S3_ENDPOINT
                  value: "{{ .Values.s3.endpoint }}"
                - name: S3_BUCKET
                  value: "{{ .Values.s3.bucket }}"
                - name: RETENTION
                  value: "{{ .Values.clickhouse.backup.retention }}"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lakehouse.s3.secretName" . }}
                      key: {{ include "lakehouse.s3.accessKeyIdKey" . }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "lakehouse.s3.secretName" . }}
                      key: {{ include "lakehouse.s3.secretAccessKeyKey" . }}
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
          volumes:
            - name: backup-script
              configMap:
                name: {{ include "lakehouse.fullname" . }}-backup-script
                defaultMode: 0755
{{- end }}
